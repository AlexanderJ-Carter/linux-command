name: CI
on:
    push:
        branches:
            - '**'
    pull_request:
        branches:
            - '**'

jobs:
    build-deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pages: write
            id-token: write
            packages: write
        concurrency:
            group: pages
            cancel-in-progress: false
        env:
            IMAGE_NAME: linux-command
            IS_RELEASE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'

            - name: Build Linux Command
              run: |
                  npm install
                  npm run dash

            - name: Create Tag
              if: env.IS_RELEASE == 'true'
              id: create_tag
              uses: jaywcjlove/create-tag-action@main
              continue-on-error: true
              with:
                  package-path: ./package.json

            - name: Get Tag Version
              if: env.IS_RELEASE == 'true'
              id: tag_version
              uses: jaywcjlove/changelog-generator@main
              continue-on-error: true

            - name: Update Dash Feed
              if: env.IS_RELEASE == 'true'
              run: |
                  VERSION="${{ steps.create_tag.outputs.versionNumber || 'deploy' }}"
                  REPO_NAME="${GITHUB_REPOSITORY#*/}"
                  BASE_URL="https://${{ github.repository_owner }}.github.io/${REPO_NAME}"
                  echo "<entry><version>${VERSION}</version><url>${BASE_URL}/linux-command.docset.tgz</url></entry>" > .deploy/linux-command-docset.xml

            - name: Generate Changelog
              if: env.IS_RELEASE == 'true'
              id: changelog
              uses: jaywcjlove/changelog-generator@main
              continue-on-error: true
              with:
                  filter-author: (小弟调调™)
                  filter: (^[\s]+?[R|r]elease)|(^[R|r]elease)

            - name: Create Release
              if: env.IS_RELEASE == 'true' && steps.create_tag.outputs.successful
              uses: ncipollo/release-action@v1
              with:
                  allowUpdates: true
                  artifacts: '.deploy/linux-command.docset.tgz'
                  draft: false
                  token: ${{ secrets.GITHUB_TOKEN }}
                  name: ${{ steps.create_tag.outputs.version }}
                  tag: ${{ steps.create_tag.outputs.version }}
                  body: |
                      [![](https://img.shields.io/badge/Open%20in-unpkg-blue)](https://uiwjs.github.io/npm-unpkg/#/pkg/linux-command@${{steps.create_tag.outputs.versionNumber}}/file/README.md) [![npm bundle size](https://img.shields.io/bundlephobia/minzip/linux-command)](https://bundlephobia.com/result?p=linux-command@${{steps.create_tag.outputs.versionNumber}})

                      ```bash
                      npm i linux-command@${{steps.create_tag.outputs.versionNumber}}
                      ```

                      ${{ steps.changelog.outputs.compareurl }}

                      ${{ steps.changelog.outputs.changelog }}


                      Document linux-command@${{ steps.changelog.outputs.tag }}:  
                      https://raw.githack.com/jaywcjlove/linux-command/${{ steps.changelog.outputs.gh-pages-short-hash }}/index.html


                      ## Docker

                      [![Docker Image Version (latest by date)](https://img.shields.io/docker/v/wcjiang/linux-command)](https://hub.docker.com/r/wcjiang/linux-command) [![Docker Image Size (latest by date)](https://img.shields.io/docker/image-size/wcjiang/linux-command)](https://hub.docker.com/r/wcjiang/linux-command) [![Docker Pulls](https://img.shields.io/docker/pulls/wcjiang/linux-command)](https://hub.docker.com/r/wcjiang/linux-command)

                      轻松通过 `docker` 部署 `linux-command` 网站。

                      ```bash
                      docker pull wcjiang/linux-command
                      ```

                      ```bash
                      docker run --name linux-command --rm -d -p 9665:3000 wcjiang/linux-command:latest
                      # Or
                      docker run --name linux-command -itd -p 9665:3000 wcjiang/linux-command:latest
                      ```

                      在浏览器中访问以下 URL

                      ```bash
                      http://localhost:9665/
                      ```

            - run: rm -rf .deploy/linux-command.docset
              if: env.IS_RELEASE == 'true'

            - name: Setup GitHub Pages
              if: env.IS_RELEASE == 'true'
              uses: actions/configure-pages@v4

            - name: Upload GitHub Pages artifact
              if: env.IS_RELEASE == 'true'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: .deploy

            - name: Deploy to GitHub Pages
              if: env.IS_RELEASE == 'true'
              id: deployment
              uses: actions/deploy-pages@v4
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - run: NODE_AUTH_TOKEN="" npm publish --access public --provenance
              if: env.IS_RELEASE == 'true'
              continue-on-error: true
              name: 📦 linux-command publish to NPM

            # Docker 构建并推送（未配置 DOCKER_USER/DOCKER_PASSWORD 时跳过，不报错）
            - name: Set up Docker Buildx
              if: env.IS_RELEASE == 'true'
              uses: docker/setup-buildx-action@v3
            - name: Login to GitHub Container Registry
              if: env.IS_RELEASE == 'true'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Login to Docker Hub (optional)
              if: env.IS_RELEASE == 'true' && secrets.DOCKER_USER != '' && secrets.DOCKER_PASSWORD != ''
              uses: docker/login-action@v3
              continue-on-error: true
              with:
                  username: ${{ secrets.DOCKER_USER }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Prepare image tags
              if: env.IS_RELEASE == 'true'
              id: image_tags
              run: |
                  tags="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:latest"
                  if [ -n "${{ secrets.DOCKER_USER }}" ]; then
                    tags="$tags,${{ secrets.DOCKER_USER }}/${IMAGE_NAME}:latest"
                  fi
                  if [ "${{ steps.create_tag.outputs.successful }}" = "true" ] && [ -n "${{ steps.changelog.outputs.version }}" ]; then
                    version="${{ steps.changelog.outputs.version }}"
                    tags="$tags,ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${version}"
                    if [ -n "${{ secrets.DOCKER_USER }}" ]; then
                      tags="$tags,${{ secrets.DOCKER_USER }}/${IMAGE_NAME}:${version}"
                    fi
                  fi
                  echo "tags=$tags" >> "$GITHUB_OUTPUT"

            - name: Build and push container images
              if: env.IS_RELEASE == 'true'
              uses: docker/build-push-action@v6
              continue-on-error: true
              with:
                  push: true
                  context: .
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.image_tags.outputs.tags }}
